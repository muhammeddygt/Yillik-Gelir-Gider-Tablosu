<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12 Aylık Birikim ve Borç Ödeme Defteri</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<meta name="theme-color" content="#1C2541">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Birikim Defteri">

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* ===== Tokens ===== */
:root{
  --leather-1:#1C2541;
  --leather-2:#232C4F;
  --leather-3:#131A30;
  --paper:#FCFBF7;
  --paper-2:#F1EEE4;
  --rule:#E0DACB;
  --ink:#1E2A44;
  --ink-soft:#5C6B85;
  --red:#C0473F;
  --gold:#147D77;
  --gold-soft:#4FB8AC;
  --green:#2E9B57;
  --font-display:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
  --font-mono:"Courier New",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse at 50% -10%, #2E4470 0%, transparent 55%),
    repeating-linear-gradient(115deg, rgba(0,0,0,0.05) 0 2px, transparent 2px 6px),
    linear-gradient(160deg, var(--leather-2), var(--leather-3) 70%);
  color:var(--ink);
  font-family:var(--font-ui);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

body::before{
  content:"";
  position:fixed; inset:0;
  background:radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%);
  pointer-events:none;
  z-index:5;
}

.stage{
  position:relative;
  width:min(94vw, 1040px);
  height:min(92vh, 1080px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  touch-action:pan-y;
}

.book{
  position:relative;
  width:100%;
  flex:1 1 auto;
  min-height:0;
  perspective:2600px;
}

.book-stack{
  position:absolute;
  inset:0;
  border-radius:3px 10px 10px 3px;
  background:var(--paper-2);
  box-shadow:
    2px 3px 0 0 #EBE7DA,
    5px 6px 0 0 #DFDAC7,
    8px 9px 0 0 #D3CDB6,
    11px 12px 14px 2px rgba(0,0,0,0.45);
  transform:translateZ(-2px);
}

.spine-shadow{
  position:absolute;
  left:0; top:0; bottom:0; width:46px;
  background:linear-gradient(90deg, rgba(0,0,0,0.32), transparent);
  z-index:20;
  pointer-events:none;
  border-radius:3px 0 0 3px;
}

.page-base{
  position:absolute;
  inset:0;
  border-radius:3px 10px 10px 3px;
  overflow:hidden;
  box-shadow:0 18px 40px rgba(0,0,0,0.5);
}

.flipper{
  position:absolute;
  inset:0;
  transform-style:preserve-3d;
  transform-origin:left center;
  z-index:10;
  pointer-events:none;
  opacity:0;
  transition:none;
}
.flipper.active{opacity:1; pointer-events:none;}
.flipper.animating{
  transition:transform 0.85s cubic-bezier(.4,.05,.2,1);
}

.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  border-radius:3px 10px 10px 3px;
  overflow:hidden;
  box-shadow:0 18px 40px rgba(0,0,0,0.5);
}
.face-back{transform:rotateY(180deg);}

.face::after{
  content:"";
  position:absolute; inset:0;
  background:linear-gradient(90deg, rgba(0,0,0,0.35), transparent 35%, transparent 65%, rgba(0,0,0,0.12));
  opacity:0;
  transition:opacity .85s ease;
  pointer-events:none;
}
.flipper.animating .face::after{opacity:1;}

.leaf{
  position:relative;
  width:100%; height:100%;
  background:
    repeating-linear-gradient(var(--paper) 0 30px, var(--rule) 30px 31px),
    var(--paper);
  padding:34px 30px 26px 54px;
  display:flex;
  flex-direction:column;
  gap:14px;
  font-family:var(--font-ui);
}
.leaf::before{
  content:"";
  position:absolute; left:34px; top:0; bottom:0; width:1px;
  background:rgba(165,67,58,0.35);
}
.leaf::after{
  content:"";
  position:absolute; left:14px; top:60px; bottom:60px; width:6px;
  background-image:radial-gradient(circle, rgba(0,0,0,0.18) 0 100%);
  background-repeat:repeat-y;
  background-size:6px 90px;
  background-position:0 0;
  opacity:0.5;
}

.leaf-scroll{
  overflow-y:auto;
  overflow-x:hidden;
  flex:1;
  padding-right:6px;
  min-height:0;
}
.leaf-scroll::-webkit-scrollbar{width:7px;}
.leaf-scroll::-webkit-scrollbar-thumb{background:var(--rule); border-radius:4px;}

.eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--red);
  font-weight:700;
}
.page-title{
  font-family:var(--font-display);
  font-size:26px;
  font-weight:700;
  color:var(--ink);
  margin:2px 0 0 0;
  letter-spacing:0.01em;
}
.page-sub{
  font-family:var(--font-ui);
  font-size:12px;
  color:var(--ink-soft);
  margin-top:2px;
}

.backup-row{
  display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 2px;
}

.hero-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:2px;
}
.hero-stat{
  background:rgba(27,54,93,0.05);
  border:1px solid rgba(27,54,93,0.12);
  border-radius:6px;
  padding:10px 12px;
}
.hero-label{
  font-size:10px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--ink-soft);
  font-weight:600;
}
.hero-value{
  font-family:var(--font-mono);
  font-size:19px;
  font-weight:700;
  color:var(--ink);
  margin-top:3px;
  font-variant-numeric:tabular-nums;
}
.hero-value.green{color:var(--green);}

.section-label{
  font-family:var(--font-display);
  font-size:14px;
  font-weight:700;
  color:var(--ink);
  border-bottom:1px solid var(--rule);
  padding-bottom:4px;
  margin-top:4px;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
}
.section-label small{
  font-family:var(--font-ui);
  font-weight:400;
  font-size:10px;
  color:var(--ink-soft);
}

table.ledger{
  border-collapse:collapse;
  width:100%;
  font-family:var(--font-mono);
  font-size:11.5px;
}
table.ledger th, table.ledger td{
  padding:5px 7px;
  text-align:right;
  white-space:nowrap;
}
table.ledger th:first-child, table.ledger td:first-child{
  text-align:left;
  font-family:var(--font-ui);
  position:sticky; left:0;
  background:var(--paper);
}
table.ledger thead th{
  font-family:var(--font-ui);
  font-size:9.5px;
  letter-spacing:0.03em;
  text-transform:uppercase;
  color:var(--ink-soft);
  border-bottom:1px solid var(--ink);
  padding-bottom:6px;
}
table.ledger tbody tr{border-bottom:1px solid var(--rule);}
table.ledger tbody tr:last-child{border-bottom:none;}
table.ledger tfoot td{
  border-top:2px solid var(--ink);
  font-weight:700;
  padding-top:7px;
}
.table-scroll{overflow-x:auto; padding-bottom:2px;}
.zero{color:#8B8B92;}

.totals-box{
  margin-top:auto;
  background:rgba(27,54,93,0.06);
  border:1px solid rgba(27,54,93,0.14);
  border-radius:6px;
  padding:12px 14px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}
.totals-box .t-label{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft);}
.totals-box .t-value{font-family:var(--font-mono); font-size:15px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums;}

.tabs{
  position:absolute;
  right:-30px; top:14px; bottom:14px;
  display:flex;
  flex-direction:column;
  gap:3px;
  z-index:30;
}
.tab{
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  background:linear-gradient(180deg, var(--gold-soft), var(--gold));
  color:#0B2A28;
  font-family:var(--font-display);
  font-size:11px;
  font-weight:700;
  letter-spacing:0.04em;
  border:none;
  border-radius:0 5px 5px 0;
  padding:7px 5px;
  cursor:pointer;
  flex:1;
  min-height:0;
  box-shadow:1px 1px 3px rgba(0,0,0,0.4);
  opacity:0.82;
  transition:opacity .2s, transform .2s, padding .2s;
}
.tab:hover{opacity:1; padding-right:8px;}
.tab.active{
  opacity:1;
  background:linear-gradient(180deg,#8FD8CB, var(--gold));
  padding-right:9px;
  box-shadow:2px 2px 5px rgba(0,0,0,0.5);
}

.nav-controls{
  width:100%;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  padding-top:18px;
  z-index:30;
}
.nav-btn{
  background:linear-gradient(180deg, var(--gold-soft), var(--gold));
  color:#0B2A28;
  border:none;
  width:46px; height:46px;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,0.5);
  display:flex; align-items:center; justify-content:center;
  transition:transform .15s;
}
.nav-btn:hover{transform:scale(1.08);}
.nav-btn:active{transform:scale(0.95);}
.nav-btn:disabled{opacity:0.3; cursor:default; transform:none;}
.page-indicator{
  font-family:var(--font-mono);
  color:var(--paper);
  font-size:12px;
  letter-spacing:0.05em;
  min-width:92px;
  text-align:center;
}

.sync-dot{
  width:14px; height:14px; min-width:14px; border-radius:50%;
  border:2px solid rgba(255,255,255,.3);
  background:#8B8B92; padding:0; cursor:pointer; flex:none;
  transition:background .3s;
}
.sync-dot.ok{background:var(--green);}
.sync-dot.saving,.sync-dot.loading{background:#D9A441; animation:syncPulse 1s ease-in-out infinite;}
.sync-dot.error{background:var(--red); animation:none;}
@keyframes syncPulse{0%,100%{opacity:1;}50%{opacity:.35;}}

.undo-toast{
  position:fixed; left:50%; bottom:22px; transform:translate(-50%, 24px);
  background:#1C2541; color:#FCFBF7; padding:10px 10px 10px 16px; border-radius:12px;
  display:flex; align-items:center; gap:12px; font-family:var(--font-ui); font-size:12.5px;
  box-shadow:0 8px 24px rgba(0,0,0,.45); opacity:0; pointer-events:none;
  transition:opacity .25s ease, transform .25s ease; z-index:200; max-width:92vw;
}
.undo-toast.show{opacity:1; transform:translate(-50%, 0); pointer-events:auto;}
.undo-toast #undoBtn{
  background:var(--gold); color:#0B2A28; border:none; border-radius:9px;
  padding:6px 12px; font-weight:700; font-size:12px; cursor:pointer; flex:none; white-space:nowrap;
}
.undo-toast #undoBtn:hover{background:var(--gold-soft);}

.corner-title{
  position:absolute;
  top:-38px; left:0;
  color:var(--gold-soft);
  font-family:var(--font-display);
  font-size:15px;
  letter-spacing:0.03em;
  opacity:0.85;
}

.install-btn{
  position:absolute; top:-43px; right:0; z-index:40;
  border:1px solid rgba(217,184,119,.65); border-radius:18px;
  padding:7px 12px; background:rgba(36,21,17,.82); color:var(--gold-soft);
  font:600 11px var(--font-ui); letter-spacing:.02em; cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.25); backdrop-filter:blur(8px);
}
.install-btn:hover{background:rgba(20,125,119,.18); border-color:var(--gold-soft);}
.install-btn[hidden]{display:none;}

.zoom-controls{
  position:absolute; top:-43px; left:0; z-index:40; display:flex; gap:6px;
}
.zoom-controls button{
  border:1px solid rgba(217,184,119,.65); border-radius:18px;
  padding:7px 11px; background:rgba(36,21,17,.82); color:var(--gold-soft);
  font:700 11px var(--font-ui); letter-spacing:.02em; cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.25); backdrop-filter:blur(8px);
}
.zoom-controls button:hover{background:rgba(20,125,119,.18); border-color:var(--gold-soft);}

.salary-card{
  background:rgba(47,93,80,0.06);
  border:1px solid rgba(47,93,80,0.22);
  border-radius:8px;
  padding:12px 14px;
  margin-bottom:4px;
}
.salary-card h3{
  font-family:var(--font-ui);
  font-size:10.5px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--green);
  margin:0 0 8px 0;
  display:flex; align-items:center; gap:8px;
}
.salary-card h3::after{
  content:'';flex:1;height:1px;
  background:repeating-linear-gradient(to right, var(--rule) 0 4px, transparent 4px 8px);
}
.salary-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px 18px;}
.salary-row{display:flex; justify-content:space-between; align-items:center; padding:3px 0; gap:8px;}
.salary-row label{font-size:12px; color:var(--ink);}
.salary-row .hint{display:block; font-size:9.5px; color:var(--ink-soft); font-family:var(--font-mono);}
.num-input{
  width:96px; text-align:right;
  font-family:var(--font-mono); font-size:12.5px; color:var(--ink);
  background:#fff; border:1px solid var(--rule); border-radius:4px;
  padding:3px 6px;
}
.num-input:focus{outline:none; border-color:var(--gold);}
.stepper2{display:flex; align-items:center; gap:5px;}
.stepper2 button{
  width:24px;height:24px; border-radius:5px; border:1px solid rgba(47,93,80,.3);
  background:#fff; color:var(--green); font-family:var(--font-mono); font-size:14px;
  line-height:1; cursor:pointer;
}
.stepper2 input{width:42px; text-align:center; font-family:var(--font-mono); font-size:13px;
  border:1px solid rgba(47,93,80,.3); border-radius:5px; padding:3px 2px;}
.salary-total{
  display:flex; justify-content:space-between; align-items:baseline;
  margin-top:8px; padding-top:8px; border-top:1px solid rgba(47,93,80,.25);
}
.salary-total .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--green); font-weight:700;}
.salary-total .val{font-family:var(--font-mono); font-size:17px; font-weight:700; color:var(--green);}

.ed-row{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:4px 0; border-bottom:1px dotted var(--rule);
}
.ed-row .name-input{
  border:none; background:transparent; font-family:var(--font-ui); font-size:12.5px;
  color:var(--ink); flex:1; min-width:0; border-bottom:1px dashed transparent;
}
.ed-row .name-input:focus{outline:none; border-bottom:1px dashed var(--gold);}
.ed-row .meta{font-size:9.5px; color:var(--ink-soft); font-family:var(--font-mono); margin-left:4px;}
.ed-row .amt-input{width:92px;}
.ed-row .del-btn{
  border:none; background:transparent; color:var(--red); font-size:14px; cursor:pointer;
  width:20px; height:20px; line-height:1; opacity:0.55;
}
.ed-row .del-btn:hover{opacity:1;}
.ed-row.na{opacity:0.4; font-style:italic;}

.paid-toggle{
  width:19px; height:19px; border-radius:50%; border:1.5px solid var(--rule);
  background:#fff; color:#fff; font-size:12px; font-weight:700; line-height:1;
  display:inline-flex; align-items:center; justify-content:center; padding:0;
  cursor:pointer; margin-right:5px; vertical-align:middle; flex:none;
}
.paid-toggle.on{background:var(--green); border-color:var(--green);}
.ed-row.paid{background:rgba(63,107,76,.09); border-radius:8px;}

td.paid-cell{background:rgba(63,107,76,.16);}
td.paid-cell .table-edit{border-color:var(--green);}

.hide-btn{
  border:none; background:transparent; cursor:pointer; font-size:12px;
  opacity:0.4; filter:grayscale(1); vertical-align:middle; margin-left:4px;
}
.hide-btn:hover{opacity:0.9;}

.hidden-panel{
  margin-top:10px; font-family:var(--font-ui); font-size:10.5px; color:var(--ink-soft);
  line-height:1.9;
}
.hidden-panel .show-btn{
  border:1px solid var(--rule); border-radius:12px; background:#fff;
  padding:2px 8px; font-size:9.5px; cursor:pointer; margin-left:3px; color:var(--ink);
}

.group-header{
  font:700 10.5px var(--font-ui); text-transform:uppercase; letter-spacing:.08em;
  color:var(--gold); margin:16px 0 6px; padding-bottom:5px; border-bottom:1px solid var(--rule);
}
.group-header-sub{
  font-weight:400; text-transform:none; letter-spacing:normal;
  color:var(--ink-soft); font-family:var(--font-mono); margin-left:2px;
}
.group-header-row td{
  background:rgba(20,125,119,.13); font:700 10px var(--font-ui); text-transform:uppercase;
  letter-spacing:.08em; color:var(--gold); padding:6px 10px !important;
}
.move-btns{display:inline-flex; flex-direction:column; gap:1px; vertical-align:middle; margin-right:4px;}
.move-btn{
  border:1px solid var(--rule); background:#fff; border-radius:4px; width:16px; height:13px;
  font-size:8px; line-height:1; cursor:pointer; padding:0; color:var(--ink-soft);
}
.move-btn:hover{color:var(--gold); border-color:var(--gold);}

.status-toggles{display:inline-flex; gap:2px; vertical-align:middle; margin-right:4px;}
.missed-toggle{
  width:19px; height:19px; border-radius:50%; border:1.5px solid var(--rule);
  background:#fff; color:#fff; font-size:11px; font-weight:700; line-height:1;
  display:inline-flex; align-items:center; justify-content:center; padding:0;
  cursor:pointer; vertical-align:middle; flex:none;
}
.missed-toggle.on{background:#9a3b3b; border-color:#9a3b3b;}
.ed-row.debt-row.missed{background:rgba(154,59,59,.09); border-radius:8px;}
td.missed-cell{background:rgba(154,59,59,.16);}
td.missed-cell .table-edit{border-color:#9a3b3b;}

.progress-row{margin:0;}
.progress-track{width:100%; height:5px; background:var(--paper-2); border-radius:3px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--gold-soft),var(--green)); border-radius:3px;}
.progress-pct{display:block; font-size:9px; color:var(--ink-soft); font-family:var(--font-mono); margin-top:2px;}

.gold-block{margin-bottom:12px;}
.gold-block-head{
  display:flex; justify-content:space-between; font:700 12px var(--font-ui);
  color:var(--ink); padding:4px 0; border-bottom:1px solid var(--rule); margin-bottom:2px;
}
.gold-row{padding:6px 0;}
.gold-amt{font-family:var(--font-mono); font-size:13px; min-width:70px; display:inline-block;}
.gold-month{font-size:11px; color:var(--ink-soft); flex:1;}
.empty-note{font-size:11px; color:var(--ink-soft); font-style:italic; padding:6px 0;}

.add-btn{
  display:inline-flex; align-items:center; gap:5px;
  border:1px dashed var(--gold);
  background:transparent; color:var(--gold);
  font-family:var(--font-ui); font-size:11px; font-weight:600;
  border-radius:14px; padding:4px 10px; cursor:pointer; margin-top:6px;
}
.add-btn:hover{background:rgba(20,125,119,0.1);}

.add-form{
  background:rgba(20,125,119,0.08);
  border:1px solid rgba(20,125,119,0.35);
  border-radius:8px;
  padding:10px 12px;
  margin-top:6px;
  display:flex; flex-direction:column; gap:6px;
}
.add-form .fr{display:flex; align-items:center; gap:8px; justify-content:space-between;}
.add-form label{font-size:11px; color:var(--ink-soft); min-width:110px;}
.add-form select, .add-form input[type=text], .add-form input[type=number]{
  font-family:var(--font-ui); font-size:12px; padding:4px 6px; border:1px solid var(--rule);
  border-radius:4px; background:#fff; flex:1;
}
.add-form .fr-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:4px;}
.mini-btn{
  font-family:var(--font-ui); font-size:11px; font-weight:600; border-radius:12px;
  padding:5px 12px; cursor:pointer; border:1px solid var(--gold);
}
.mini-btn.primary{background:var(--gold); color:#0B2A28;}
.mini-btn.ghost{background:transparent; color:var(--ink-soft); border-color:var(--rule);}

.oran-input{width:52px; font-family:var(--font-mono); font-size:11px; text-align:right;
  border:1px solid var(--rule); border-radius:4px; padding:2px 4px; background:#fff;}

.badge-tur{

    if(!Array.isArray(d[field + 'Monthly'])) d[field + 'Monthly'] = new Array(12).fill(null);
    d[field + 'Monthly'][i] = value;
  }
  function debtFieldIsOverridden(d, field, i){
    var arr = d[field + 'Monthly'];
    return Array.isArray(arr) && arr[i] !== null && arr[i] !== undefined && arr[i] !== '';
  }
  function billAmountForMonth(f, i){
    if(Array.isArray(f.monthlyAmounts)) return Number(f.monthlyAmounts[i] || 0);
    return Number(f.tutar || 0);
  }
  function billTotalForMonth(i){
    return STATE.faturalar.reduce(function(s,f){ return s + billAmountForMonth(f,i); },0);
  }
  function offBudgetTotalForMonth(i){
    var items = STATE.offBudgetExpenses[i] || [];
    return items.reduce(function(s,item){return s + Number(item.tutar || 0);},0);
  }
  function transferredBillsForCard(cardId, targetMonth){
    return STATE.faturalar.reduce(function(total,f){
      var transfers = f.cardTransfers || {};
      return total + Object.keys(transfers).reduce(function(sub,key){
        var tr = transfers[key];
        return sub + (tr && tr.cardId===cardId && Number(tr.targetMonth)===targetMonth ? Number(tr.amount||0) : 0);
      },0);
    },0);
  }
  function transferredOffBudgetForCard(cardId, targetMonth){
    var total = 0;
    for(var mi=0; mi<12; mi++){
      (STATE.offBudgetExpenses[mi] || []).forEach(function(item){
        var tr = item.cardTransfer;
        if(tr && tr.cardId===cardId && Number(tr.targetMonth)===targetMonth) total += Number(tr.amount||0);
      });
    }
    return total;
  }
  function additionsForDebt(d, i){
    return Number((d.additions && d.additions[i]) || 0) + transferredBillsForCard(d.id, i) + transferredOffBudgetForCard(d.id, i);
  }

  function calcDebtSeries(d){
    var balances = new Array(12).fill(null);
    var paid = new Array(12).fill(null);
    var suggested = new Array(12).fill(null);
    var bal = Number(d.baslangic || 0);
    for(var i=0;i<12;i++){
      if(i < d.startMonthIndex){ continue; }
      var payment, sugg;
      if(d.tur === 'kredi_karti'){
        // Faiz SADECE bu ay başında devreden (yeni harcama eklenmeden önceki) bakiye
        // üzerinden hesaplanır — yeni harcamalar aynı ay içinde henüz faize tabi olmaz.
        // Asgari ödeme ise devreden + bu ay yapılan yeni harcamaların TOPLAMI üzerinden
        // hesaplanır. İkisi toplanarak önerilen ödeme bulunur.
        var eskiBakiye = bal;
        var buAyEklenen = additionsForDebt(d, i);
        bal = eskiBakiye + buAyEklenen;
        var faizYuzdeVal = debtFieldMonthly(d,'faizYuzde',i);
        var asgariYuzdeVal = debtFieldMonthly(d,'asgariYuzde',i);
        var faizTutari = eskiBakiye * (faizYuzdeVal/100);
        var faizli = bal + faizTutari;
        sugg = bal * (asgariYuzdeVal/100) + faizTutari;
        payment = (d.payments && d.payments[i] !== undefined) ? Number(d.payments[i]) : sugg;
        bal = Math.max(0, faizli - payment);
      } else if(d.tur === 'kmh'){
        bal += additionsForDebt(d, i);
        var faizYuzdeValKmh = debtFieldMonthly(d,'faizYuzde',i);
        var faizliKmh = bal * (1 + (faizYuzdeValKmh/100));
        sugg = bal * (faizYuzdeValKmh/100);
        payment = (d.payments && d.payments[i] !== undefined) ? Number(d.payments[i]) : sugg;
        bal = Math.max(0, faizliKmh - payment);
      } else if(d.tur === 'kredi'){
        bal += additionsForDebt(d, i);
        var taksitVal = debtFieldMonthly(d,'taksit',i);
        sugg = Math.min(taksitVal, bal);
        payment = (d.payments && d.payments[i] !== undefined) ? Number(d.payments[i]) : sugg;
        bal = Math.max(0, bal - payment);
      } else {
        bal += additionsForDebt(d, i);
        sugg = 0;
        payment = (d.payments && d.payments[i] !== undefined) ? Number(d.payments[i]) : 0;
        bal = Math.max(0, bal - payment);
      }
      if(d.balanceOverrides && hasOwn(d.balanceOverrides, i)) bal = Math.max(0, Number(d.balanceOverrides[i] || 0));
      balances[i] = bal;
      paid[i] = payment;
      suggested[i] = sugg;
    }
    return {balances:balances, paid:paid, suggested:suggested};
  }

  function calcEkSeries(d){
    var balances = new Array(12).fill(null);
    var paid = new Array(12).fill(null);
    var bal = Number(d.baslangic || 0);
    for(var i=0;i<12;i++){
      if(i < d.startMonthIndex){ continue; }
      bal += Number((d.additions && d.additions[i]) || 0);
      var payment = (d.payments && d.payments[i] !== undefined) ? Number(d.payments[i]) : 0;
      bal = Math.max(0, bal - payment);
      if(d.balanceOverrides && hasOwn(d.balanceOverrides, i)) bal = Math.max(0, Number(d.balanceOverrides[i] || 0));
      balances[i] = bal;
      paid[i] = payment;
    }
    return {balances:balances, paid:paid};
  }

  // Borçlar + ek borçlular toplamının her ay sonundaki (o ayın ödemeleri düşüldükten
  // sonraki) kalan bakiyesi. Hem Özet sayfası hem de tekil ay sayfaları bunu kullanır.
  function computeGrandTotals(){
    var ekTotalStart = STATE.ekBorclular.reduce(function(s,d){return s+d.baslangic;},0);
    var ekTotalByMonth = [];
    for(var iEk=0;iEk<12;iEk++){
      var tEk = STATE.ekBorclular.reduce(function(s,d){
        if(iEk < d.startMonthIndex) return s;
        var ser = calcEkSeries(d);
        return s + (ser.balances[iEk]||0);
      },0);
      ekTotalByMonth.push(tEk);
    }
    var debtOnlyTotalStart = STATE.debts.reduce(function(s,d){return s+d.baslangic;},0);
    var debtOnlyTotalByMonth = [];
    for(var i=0;i<12;i++){
      var t = STATE.debts.reduce(function(s,d){
        if(i < d.startMonthIndex) return s;
        var ser = calcDebtSeries(d);
        return s + (ser.balances[i]||0);
      },0);
      debtOnlyTotalByMonth.push(t);
    }
    var totalStart = debtOnlyTotalStart + ekTotalStart;
    var totalByMonth = debtOnlyTotalByMonth.map(function(v,i){return v + ekTotalByMonth[i];});
    return {
      ekTotalStart:ekTotalStart, ekTotalByMonth:ekTotalByMonth,
      debtOnlyTotalStart:debtOnlyTotalStart, debtOnlyTotalByMonth:debtOnlyTotalByMonth,
      totalStart:totalStart, totalByMonth:totalByMonth
    };
  }

  // Bir ay "kapandı" sayılır: o ay görünür (gizli olmayan) her borç/ek borçlu/sabit
  // gider "Ödendi" tikiyle işaretlenmiş VE o aya ait hesap dışı giderlerin hepsi
  // ödendi işaretlenmiş ise. Gizli kalemler ve henüz başlamamış borçlar hesaba katılmaz.
  function monthFullyClosed(i){
    var debtsOk = sortedVisibleDebts().every(function(d){
      return i < d.startMonthIndex || !!(d.paidMonths && d.paidMonths[i]);
    });
    if(!debtsOk) return false;
    var ekOk = sortedVisibleEk().every(function(d){
      return i < d.startMonthIndex || !!(d.paidMonths && d.paidMonths[i]);
    });
    if(!ekOk) return false;
    var expOk = STATE.expenses.every(function(e){
      return !!(e.paidMonths && e.paidMonths[i]);
    });
    if(!expOk) return false;
    var faturaOk = STATE.faturalar.every(function(f){
      var transferred = (f.cardTransfers || {})[i];
      return !!transferred || !!(f.paidMonths && f.paidMonths[i]);
    });
    if(!faturaOk) return false;
    var offOk = (STATE.offBudgetExpenses[i]||[]).every(function(item){ return !!item.cardTransfer || !!item.paid; });
    return offOk;
  }

  // İlk "açık" (henüz tamamen kapanmamış) ayın index'i. 12 dönerse tüm yıl kapanmış demektir.
  function firstOpenMonthIndex(){
    for(var i=0;i<12;i++){ if(!monthFullyClosed(i)) return i; }
    return 12;
  }

  function salaryForMonth(i){
    var f = STATE.salaryFixed;
    var v = STATE.salaryMonthly[MONTHS[i]] || {pazarGun:0, mesaiSaat:0};
    var pazarUcret = v.pazarGun * f.pazarRate;
    var mesaiUcret = v.mesaiSaat * f.mesaiRate;
    var toplam = f.netMaas + f.sendika + f.aile + pazarUcret + mesaiUcret;
    return {pazarUcret:pazarUcret, mesaiUcret:mesaiUcret, toplam:toplam};
  }

  function monthTotals(i){
    var gelir = salaryForMonth(i).toplam;
    var expTotal = STATE.expenses.reduce(function(s,e){
      var val = Array.isArray(e.monthlyAmounts) ? e.monthlyAmounts[i] : e.tutar;
      return s + Number(val||0);
    },0);
    var offBudgetTotal = offBudgetTotalForMonth(i);
    var faturaTotal = billTotalForMonth(i);
    var debtPaidTotal = STATE.debts.reduce(function(s,d){
      if(i < d.startMonthIndex) return s;
      var ser = calcDebtSeries(d);
      return s + (ser.paid[i]||0);
    },0);
    var ekPaidTotal = STATE.ekBorclular.reduce(function(s,d){
      if(i < d.startMonthIndex) return s;
      var ser = calcEkSeries(d);
      return s + (ser.paid[i]||0);
    },0);
    var toplamGider = expTotal + offBudgetTotal + faturaTotal + debtPaidTotal + ekPaidTotal;
    var netKalan = gelir - toplamGider;
    return {
      gelir:gelir, toplamGider:toplamGider, netKalan:netKalan,
      sabitGiderTotal:expTotal, offBudgetTotal:offBudgetTotal, faturaTotal:faturaTotal,
      debtPaidTotal:debtPaidTotal, ekPaidTotal:ekPaidTotal, toplamBorcOdemesi:debtPaidTotal+ekPaidTotal
    };
  }

  function borsaSeries(){
    var cum = 0, out = [];
    for(var i=0;i<12;i++){
      var net = monthTotals(i).netKalan;
      var oran = (STATE.borsaOran[i]||0)/100;
      cum = (i===0) ? net : cum*(1+oran) + net;
      out.push(cum);
    }
    return out;
  }

  function pageCount(){ return 13; }

  function balanceInputHtml(listName, d, i, value){
    var overridden = hasOwn(d.balanceOverrides, i);
    return '<input class="table-edit '+(overridden?'is-override':'')+'" data-action="balance" data-list="'+listName+'" data-id="'+d.id+'" data-mi="'+i+'" type="text" inputmode="decimal" value="'+editVal(value)+'">';
  }

  function paidToggleHtml(listName, d, i){
    var paid = !!(d.paidMonths && d.paidMonths[i]);
    return '<button type="button" class="paid-toggle'+(paid?' on':'')+'" data-action="toggle-paid" data-list="'+listName+'" data-id="'+d.id+'" data-mi="'+i+'" title="Ödendi">'+(paid?'✓':'')+'</button>';
  }

  function hiddenPanelHtml(refMonthIdx){
    var hiddenDebts = STATE.debts.filter(function(d){return d.hidden;});
    var hiddenEk = STATE.ekBorclular.filter(function(d){return d.hidden;});
    function balAt(d, calcFn){
      if(refMonthIdx >= 12) return calcFn(d).balances[11] || 0;
      if(refMonthIdx <= 0) return Number(d.baslangic || 0);
      if(refMonthIdx <= d.startMonthIndex) return 0;
      return calcFn(d).balances[refMonthIdx-1] || 0;
    }
    var items = hiddenDebts.map(function(d){return {d:d, list:'debts', bal: balAt(d, calcDebtSeries)};})
      .concat(hiddenEk.map(function(d){return {d:d, list:'ekBorclular', bal: balAt(d, calcEkSeries)};}));
    if(!items.length) return '';
    var hiddenTotal = items.reduce(function(s,o){return s + o.bal;},0);
    var note = hiddenTotal > 0 ? ' — bu tutar yukarıdaki genel toplama dahildir' : '';
    return '<div class="hidden-panel">Gizlenen '+items.length+' kalem ('+fmtShort(hiddenTotal)+')'+note+' &middot; '+
      items.map(function(o){
        return esc(o.d.ad)+' ('+fmtShort(o.bal)+') <button type="button" class="show-btn" data-action="show-item" data-list="'+o.list+'" data-id="'+o.d.id+'">Göster</button>';
      }).join(' &middot; ')+
    '</div>';
  }

  function principalInputHtml(listName, d){
    return '<input class="table-edit" data-action="principal" data-list="'+listName+'" data-id="'+d.id+'" type="text" inputmode="decimal" value="'+editVal(d.baslangic)+'">';
  }

  var GROUP_ORDER = ['kredi_karti','kmh','kredi','manuel'];
  var GROUP_LABELS = {kredi_karti:'Kredi Kartları', kmh:'KMH Hesapları', kredi:'Krediler', manuel:'Manuel Takip'};

  function sortedVisibleDebts(){
    return STATE.debts.filter(function(d){return !d.hidden;}).sort(function(a,b){
      var ga = GROUP_ORDER.indexOf(a.tur); if(ga===-1) ga = GROUP_ORDER.length;
      var gb = GROUP_ORDER.indexOf(b.tur); if(gb===-1) gb = GROUP_ORDER.length;
      if(ga!==gb) return ga-gb;
      return (a.sortOrder||0)-(b.sortOrder||0);
    });
  }
  function sortedVisibleEk(){
    return STATE.ekBorclular.filter(function(d){return !d.hidden;}).sort(function(a,b){
      return (a.sortOrder||0)-(b.sortOrder||0);
    });
  }
  function sortedFaturalar(){
    return STATE.faturalar.slice().sort(function(a,b){
      return (a.sortOrder||0)-(b.sortOrder||0);
    });
  }
  function moveItem(listName, id, dir){
    var list = findList(listName);
    var groupKeyFn = (listName==='debts') ? function(x){return x.tur;} : function(){return '_all';};
    var item = list.filter(function(x){return x.id===id;})[0];
    if(!item) return;
    var gk = groupKeyFn(item);
    var siblings = list.filter(function(x){return groupKeyFn(x)===gk;}).sort(function(a,b){return (a.sortOrder||0)-(b.sortOrder||0);});
    var idx = siblings.findIndex(function(x){return x.id===id;});
    var swapIdx = idx+dir;
    if(swapIdx<0 || swapIdx>=siblings.length) return;
    var tmp = siblings[idx].sortOrder;
    siblings[idx].sortOrder = siblings[swapIdx].sortOrder;
    siblings[swapIdx].sortOrder = tmp;
    save(); rerenderCurrent();
  }
  function moveButtonsHtml(listName, id){
    return '<span class="move-btns">'+
      '<button type="button" class="move-btn" data-action="move-up" data-list="'+listName+'" data-id="'+id+'" title="Yukarı">▲</button>'+
      '<button type="button" class="move-btn" data-action="move-down" data-list="'+listName+'" data-id="'+id+'" title="Aşağı">▼</button>'+
    '</span>';
  }
  function missedToggleHtml(listName, d, i){
    var missed = !!(d.missedMonths && d.missedMonths[i]);
    return '<button type="button" class="missed-toggle'+(missed?' on':'')+'" data-action="toggle-missed" data-list="'+listName+'" data-id="'+d.id+'" data-mi="'+i+'" title="Ödenemedi">'+(missed?'✕':'')+'</button>';
  }

  function renderOzet(){
    var debtRows = '';
    var lastTur = null;
    sortedVisibleDebts().forEach(function(d){
      if(d.tur !== lastTur){
        lastTur = d.tur;
        debtRows += '<tr class="group-header-row"><td colspan="14">'+(GROUP_LABELS[d.tur]||d.tur)+'</td></tr>';
      }
      var ser = calcDebtSeries(d);
      var cells = ser.balances.map(function(v,i){
        if(i < d.startMonthIndex) return '<td class="zero">—</td>';
        var isPaidC = d.paidMonths && d.paidMonths[i];
        var isMissedC = d.missedMonths && d.missedMonths[i];
        var cls = isPaidC ? ' class="paid-cell"' : (isMissedC ? ' class="missed-cell"' : '');
        return '<td'+cls+'><span class="status-toggles">'+paidToggleHtml('debts',d,i)+missedToggleHtml('debts',d,i)+'</span>'+balanceInputHtml('debts',d,i,v)+'</td>';
      }).join('');
      debtRows += '<tr><td>'+moveButtonsHtml('debts',d.id)+'<input class="table-name-input" data-action="name" data-list="debts" data-id="'+d.id+'" value="'+esc(d.ad)+'"> '+
        '<span class="badge-tur '+d.tur+'">'+turLabel(d.tur)+'</span><button class="hide-btn" data-action="hide-item" data-list="debts" data-id="'+d.id+'" title="Gizle">🙈</button><button class="table-del" data-action="del" data-list="debts" data-id="'+d.id+'" title="Sil">✕</button></td><td>'+principalInputHtml('debts',d)+'</td>'+cells+'</tr>';
    });

    var ekDebtRows = sortedVisibleEk().map(function(d){
      var ser = calcEkSeries(d);
      var cells = ser.balances.map(function(v,i){
        if(i < d.startMonthIndex) return '<td class="zero">—</td>';
        var isPaidC = d.paidMonths && d.paidMonths[i];
        var isMissedC = d.missedMonths && d.missedMonths[i];
        var cls = isPaidC ? ' class="paid-cell"' : (isMissedC ? ' class="missed-cell"' : '');
        return '<td'+cls+'><span class="status-toggles">'+paidToggleHtml('ekBorclular',d,i)+missedToggleHtml('ekBorclular',d,i)+'</span>'+balanceInputHtml('ekBorclular',d,i,v)+'</td>';
      }).join('');
      return '<tr><td>'+moveButtonsHtml('ekBorclular',d.id)+'<input class="table-name-input" data-action="name" data-list="ekBorclular" data-id="'+d.id+'" value="'+esc(d.ad)+'">'+
        '<button class="hide-btn" data-action="hide-item" data-list="ekBorclular" data-id="'+d.id+'" title="Gizle">🙈</button><button class="table-del" data-action="del" data-list="ekBorclular" data-id="'+d.id+'" title="Sil">✕</button></td><td>'+principalInputHtml('ekBorclular',d)+'</td>'+cells+'</tr>';
    }).join('');

    var faturaRows = sortedFaturalar().map(function(f){
      var cells = MONTHS.map(function(m,i){
        var transferred = (f.cardTransfers || {})[i];
        if(transferred){
          var trCard2 = STATE.debts.filter(function(c){return c.id === transferred.cardId;})[0];
          var trCardName2 = trCard2 ? trCard2.ad : 'silinmiş kart';
          return '<td><span class="meta" style="display:block;">→ '+esc(trCardName2)+'</span><input class="table-edit is-override" data-action="bill-transfer-amt" data-id="'+f.id+'" data-mi="'+i+'" type="text" inputmode="decimal" value="'+editVal(transferred.amount)+'"></td>';
        }
        return '<td>'+paidToggleHtml('faturalar',f,i)+'<input class="table-edit" data-action="bill-amt" data-id="'+f.id+'" data-mi="'+i+'" type="text" inputmode="decimal" value="'+editVal(billAmountForMonth(f,i))+'"></td>';
      }).join('');
      return '<tr><td>'+moveButtonsHtml('faturalar',f.id)+'<input class="table-name-input" data-action="name" data-list="faturalar" data-id="'+f.id+'" value="'+esc(f.ad)+'">'+
        '<button class="table-del" data-action="del" data-list="faturalar" data-id="'+f.id+'" title="Sil">✕</button></td>'+cells+'</tr>';
    }).join('');
    var faturaTotalCells = MONTHS.map(function(m,i){return '<td>'+fmtShort(billTotalForMonth(i))+'</td>';}).join('');

    var gt = computeGrandTotals();
    var ekTotalStart = gt.ekTotalStart, ekTotalByMonth = gt.ekTotalByMonth;
    var ekTotalCells = ekTotalByMonth.map(function(v){return '<td>'+fmtShort(v)+'</td>';}).join('');

    var debtOnlyTotalStart = gt.debtOnlyTotalStart, debtOnlyTotalByMonth = gt.debtOnlyTotalByMonth;
    var debtOnlyTotalCells = debtOnlyTotalByMonth.map(function(v){return '<td>'+fmtShort(v)+'</td>';}).join('');

    var totalStart = gt.totalStart, totalByMonth = gt.totalByMonth;
    var totalCells = totalByMonth.map(function(v){return '<td>'+fmtShort(v)+'</td>';}).join('');

    var headMonths = MONTHS.map(function(m){return '<th>'+MONTH_ABBR[m]+'</th>';}).join('');

    var gelirRow = [], giderRow = [], debtPaidRow = [], offBudgetRow = [];
    var netRow = [], netCumRow = [], borsaRow = [], monthlyMetrics = [];
    var cumNet = 0;
    var borsa = borsaSeries();
    for(var i=0;i<12;i++){
      var mt = monthTotals(i);
      monthlyMetrics.push(mt);
      cumNet += mt.netKalan;
      gelirRow.push('<td>'+fmtShort(mt.gelir)+'</td>');
      giderRow.push('<td>'+fmtShort(mt.toplamGider)+'</td>');
      debtPaidRow.push('<td>'+fmtShort(mt.toplamBorcOdemesi)+'</td>');
      offBudgetRow.push('<td>'+fmtShort(mt.offBudgetTotal)+'</td>');
      netRow.push('<td>'+fmtShort(mt.netKalan)+'</td>');
      netCumRow.push('<td>'+fmtShort(cumNet)+'</td>');
      borsaRow.push('<td>'+fmtShort(borsa[i])+'</td>');
    }

    var oranInputs = MONTHS.map(function(m,i){
      return '<td><input class="oran-input" data-action="borsa-oran" data-i="'+i+'" type="text" inputmode="decimal" value="'+editVal(STATE.borsaOran[i]).replace(',00','')+'"><span class="unit">%</span></td>';
    }).join('');

    var endKalan = totalByMonth[11];
    var endBorsa = borsa[11];
    var openIdx = firstOpenMonthIndex();
    // Referans noktasından (openIdx) itibaren başlayan ama henüz o ay kapatılmadığı için
    // totalByMonth[openIdx-1]'e dahil olmayan borç/ek borçluların TAM (hiç ödeme
    // düşülmemiş) başlangıç tutarlarını hesaplıyoruz. Böylece yeni bir borç eklenir
    // eklenmez -- ilgili ay kapatılmayı beklemeden -- Kalan Borç rakamına yansır.
    function notYetReflectedTotal(refIdx){
      var sum = 0;
      STATE.debts.forEach(function(d){ if(d.startMonthIndex >= refIdx) sum += Number(d.baslangic || 0); });
      STATE.ekBorclular.forEach(function(d){ if(d.startMonthIndex >= refIdx) sum += Number(d.baslangic || 0); });
      return sum;
    }
    var currentRemainingLabel, currentRemainingValue;
    if(openIdx >= 12){
      currentRemainingLabel = 'Tüm Yıl Kapandı · Kalan Borç';
      currentRemainingValue = endKalan;
    } else if(openIdx === 0){
      currentRemainingLabel = MONTHS[0]+' İtibarıyla Kalan Borç';
      currentRemainingValue = totalStart;
    } else {
      currentRemainingLabel = MONTHS[openIdx]+' İtibarıyla Kalan Borç';
      currentRemainingValue = totalByMonth[openIdx-1] + notYetReflectedTotal(openIdx);
    }
    var maxFlow = monthlyMetrics.reduce(function(max,mt){return Math.max(max,mt.gelir,mt.toplamGider);},1);
    var reportCards = monthlyMetrics.map(function(mt,i){
      var incomeWidth = Math.max(2,Math.min(100,(mt.gelir/maxFlow)*100));
      var expenseWidth = Math.max(2,Math.min(100,(mt.toplamGider/maxFlow)*100));
      return '<div class="report-card">'+
        '<div class="report-month">'+MONTHS[i]+'</div>'+
        '<div class="report-value '+(mt.netKalan<0?'negative':'')+'">'+fmtShort(mt.netKalan)+'</div>'+

    var faturaRows = sortedFaturalar().map(function(e){

      g.payment += (gser.paid[mi]||0);
      g.balance += (gser.balances[mi]||0);
    });

    var debtRows = '';
    var lastTurM = null;
    sortedVisibleDebts().forEach(function(d){
      if(d.tur !== lastTurM){
        lastTurM = d.tur;
        var gt3 = groupTotalsM[d.tur] || {payment:0, balance:0};
        debtRows += '<div class="group-header">'+(GROUP_LABELS[d.tur]||d.tur)+
          ' <span class="group-header-sub">('+fmtShort(gt3.payment).replace(' TL','')+'/'+fmtShort(gt3.balance).replace(' TL','')+')</span></div>';

      if(mi < d.startMonthIndex){

    var ekRows = sortedVisibleEk().map(function(d){

        '<div class="debt-details"><span class="meta">'+fmtShort(ser.balances[mi])+'</span></div>'+
        '<div class="progress-row"></div>'+
        '<div class="field-stack"><span class="mini-label">Ödeme</span><input class="num-input amt-input" data-list="ekBorclular" data-id="'+d.id+'" data-mi="'+mi+'" data-action="pay" type="text" inputmode="decimal" value="'+editVal(payVal)+'">'+

      '<div class="offbudget-block">'+

  var pageBase = document.getElementById('pageBase');
  var flipper = document.getElementById('flipper');
  var faceFront = flipper.querySelector('.face-front .leaf');
  var faceBack = flipper.querySelector('.face-back .leaf');
  var baseLeaf = pageBase.querySelector('.leaf');
  var indicator = document.getElementById('pageIndicator');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var tabsEl = document.getElementById('tabs');
  var current = 0;
  var animating = false;

  function buildTabs(){
    var labels = ['Özet'].concat(MONTHS.map(function(m){return MONTH_ABBR[m];}));
    labels.forEach(function(label, i){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab' + (i===0 ? ' active' : '');
      b.textContent = label;
      b.addEventListener('click', function(){ goTo(i); });
      tabsEl.appendChild(b);
    });
  }
  function updateTabs(){
    var tabs = tabsEl.querySelectorAll('.tab');
    tabs.forEach(function(t,i){
      t.classList.toggle('active', i===current);
    });
  }
  function updateIndicator(){
    indicator.textContent = (current===0?'Özet':MONTH_ABBR[MONTHS[current-1]]) + ' · ' + (current+1) + ' / ' + pageCount();
    prevBtn.disabled = (current===0);
    nextBtn.disabled = (current===pageCount()-1);
  }

  function rerenderCurrent(){
    var scroller = baseLeaf.querySelector('.leaf-scroll');
    var scrollTop = scroller ? scroller.scrollTop : 0;
    
    baseLeaf.innerHTML = renderPage(current);
    
    var newScroller = baseLeaf.querySelector('.leaf-scroll');
    if(newScroller){
      newScroller.scrollTop = scrollTop;
    }
  }

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function goTo(target){
    if(animating || target === current || target < 0 || target >= pageCount()) return;
    var dir = target > current ? 'next' : 'prev';
    animating = true;
    baseLeaf.innerHTML = renderPage(target);

    if(reduceMotion){
      current = target;
      updateIndicator(); updateTabs(); animating = false;
      return;
    }
    flipper.classList.remove('animating');
    flipper.style.transition = 'none';
    if(dir === 'next'){
      faceFront.innerHTML = renderPage(current);
      faceBack.innerHTML = renderPage(target);
      flipper.style.transform = 'rotateY(0deg)';
    } else {
      faceFront.innerHTML = renderPage(target);
      faceBack.innerHTML = renderPage(current);
      flipper.style.transform = 'rotateY(-180deg)';
    }
    flipper.classList.add('active');
    void flipper.offsetWidth;
    flipper.classList.add('animating');
    flipper.style.transition = '';
    requestAnimationFrame(function(){
      flipper.style.transform = (dir === 'next') ? 'rotateY(-180deg)' : 'rotateY(0deg)';
    });
    var done = function(){
      flipper.removeEventListener('transitionend', done);
      flipper.classList.remove('active','animating');
      current = target;
      updateIndicator(); updateTabs();
      animating = false;
    };
    flipper.addEventListener('transitionend', done);
    setTimeout(function(){ if(animating) done(); }, 1100);
  }

  prevBtn.addEventListener('click', function(){ goTo(current-1); });
  nextBtn.addEventListener('click', function(){ goTo(current+1); });

  function findList(name){
    return STATE[name];
  }

  var lastDeleted = null;
  var undoTimeoutId = null;
  var undoToastEl = document.getElementById('undoToast');
  var undoToastMsgEl = document.getElementById('undoToastMsg');
  var undoBtnEl = document.getElementById('undoBtn');

  function showUndoToast(message){
    if(!undoToastEl) return;
    if(undoToastMsgEl) undoToastMsgEl.textContent = message;
    undoToastEl.classList.add('show');
    clearTimeout(undoTimeoutId);
    undoTimeoutId = setTimeout(function(){
      undoToastEl.classList.remove('show');
      lastDeleted = null;
    }, 7000);
  }

  function performUndo(){
    if(!lastDeleted) return;
    if(lastDeleted.type === 'offbudget'){
      var arr = STATE.offBudgetExpenses[lastDeleted.offMi] || (STATE.offBudgetExpenses[lastDeleted.offMi] = []);
      arr.splice(Math.min(lastDeleted.index, arr.length), 0, lastDeleted.item);
    } else {
      var list = findList(lastDeleted.listName);
      if(list) list.splice(Math.min(lastDeleted.index, list.length), 0, lastDeleted.item);
    }
    lastDeleted = null;
    clearTimeout(undoTimeoutId);
    if(undoToastEl) undoToastEl.classList.remove('show');
    save(); rerenderCurrent();
  }

  if(undoBtnEl) undoBtnEl.addEventListener('click', performUndo);

  function onChange(e){
    var t = e.target;
    var action = t.dataset.action;
    if(!action) return;

    if(action === 'import-file'){
      var file = t.files && t.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        try{
          var parsed = JSON.parse(ev.target.result);
          STATE = normalizeState(parsed);
          save();
          rerenderCurrent();
          window.alert('Yedek yüklendi.');
        }catch(err){ window.alert('Dosya okunamadı.'); }
      };
      reader.readAsText(file);
      t.value = '';
      return;
    }

    if(action === 'fixed'){
      if(String(t.value).trim()===''){ rerenderCurrent(); return; }
      STATE.salaryFixed[t.dataset.field] = parseNum(t.value);
      save(); rerenderCurrent(); return;
    }
    if(action === 'monthly'){
      var mi = current - 1;
      if(mi < 0) return;
      if(String(t.value).trim()===''){ rerenderCurrent(); return; }
      STATE.salaryMonthly[MONTHS[mi]][t.dataset.field] = Math.max(0, Math.round(parseNum(t.value)));
      save(); rerenderCurrent(); return;
    }
    if(action === 'borsa-oran'){
      if(String(t.value).trim()===''){ rerenderCurrent(); return; }
      var idx = parseInt(t.dataset.i,10);
      STATE.borsaOran[idx] = parseNum(t.value);
      save(); rerenderCurrent(); return;
    }
    if(action === 'name'){
      var list = findList(t.dataset.list);
      var item = list.filter(function(x){return x.id===t.dataset.id;})[0];
      if(item){ item.ad = t.value; save(); }
      return;
    }
    if(action === 'exp-amt'){
      if(String(t.value).trim()===''){ rerenderCurrent(); return; }
      var listExp = findList(t.dataset.list);
      var itemExp = listExp.filter(function(x){return x.id===t.dataset.id;})[0];
      var expMi = parseInt(t.dataset.mi, 10);
      if(itemExp){
        if(!Array.isArray(itemExp.monthlyAmounts)) itemExp.monthlyAmounts = MONTHS.map(function(){return Number(itemExp.tutar||0);});
        itemExp.monthlyAmounts[expMi] = Math.max(0, parseNum(t.value));
        save(); rerenderCurrent();
      }
      return;
    }
    if(action === 'offbudget-name' || action === 'offbudget-amt'){
      if(action === 'offbudget-amt' && String(t.value).trim()===''){ rerenderCurrent(); return; }
      var offMi = parseInt(t.dataset.mi,10);
      var offList = STATE.offBudgetExpenses[offMi] || [];
      var offItem = offList.filter(function(x){return x.id===t.dataset.id;})[0];
      if(offItem){
        if(action === 'offbudget-name') offItem.ad = t.value;
        else offItem.tutar = Math.max(0,parseNum(t.value));
        save();
        if(action === 'offbudget-amt') rerenderCurrent();
      }
      return;
    }
    if(action === 'bill-amt'){
      if(String(t.value).trim()===''){ rerenderCurrent(); return; }
      var bill = STATE.faturalar.filter(function(x){return x.id===t.dataset.id;})[0];
      var billMi = parseInt(t.dataset.mi,10);
      if(bill){
        if(!Array.isArray(bill.monthlyAmounts)) bill.monthlyAmounts = MONTHS.map(function(){return Number(bill.tutar||0);});
        bill.monthlyAmounts[billMi] = Math.max(0, parseNum(t.value));
        save(); rerenderCurrent();
      }
      return;
    }
    if(action === 'bill-transfer-amt'){
      if(String(t.value).trim()===''){ rerenderCurrent(); return; }
      var trBill = STATE.faturalar.filter(function(x){return x.id===t.dataset.id;})[0];
      var trBillMi = parseInt(t.dataset.mi,10);
      var trBillEntry = trBill && trBill.cardTransfers ? trBill.cardTransfers[trBillMi] : null;
      if(trBillEntry){
        trBillEntry.amount = Math.max(0, parseNum(t.value));
        save(); rerenderCurrent();
      }
      return;
    }
    if(action === 'offbudget-transfer-amt'){
      if(String(t.value).trim()===''){ rerenderCurrent(); return; }
      var trObMi = parseInt(t.dataset.mi,10);
      var trObList = STATE.offBudgetExpenses[trObMi] || [];
      var trObItem = trObList.filter(function(x){return x.id===t.dataset.id;})[0];
      if(trObItem && trObItem.cardTransfer){
        trObItem.cardTransfer.amount = Math.max(0, parseNum(t.value));
        save(); rerenderCurrent();
      }
      return;
    }
    if(action === 'principal'){
      if(String(t.value).trim()===''){ rerenderCurrent(); return; }
      var principalList = findList(t.dataset.list);
      var principalItem = principalList.filter(function(x){return x.id===t.dataset.id;})[0];
      if(principalItem){ principalItem.baslangic = Math.max(0, parseNum(t.value)); save(); rerenderCurrent(); }
      return;
    }
    if(action === 'balance'){
      var balanceList = findList(t.dataset.list);
      var balanceItem = balanceList.filter(function(x){return x.id===t.dataset.id;})[0];
      var balanceMi = parseInt(t.dataset.mi,10);
      if(balanceItem){
        balanceItem.balanceOverrides = balanceItem.balanceOverrides || {};
        if(String(t.value).trim()==='') delete balanceItem.balanceOverrides[balanceMi];
        else balanceItem.balanceOverrides[balanceMi] = Math.max(0, parseNum(t.value));
        save(); rerenderCurrent();
      }
      return;
    }
    if(action === 'pay'){
      var list3 = findList(t.dataset.list);
      var item3 = list3.filter(function(x){return x.id===t.dataset.id;})[0];
      var mi3 = parseInt(t.dataset.mi,10);
      if(item3){
        item3.payments = item3.payments || {};
        if(String(t.value).trim()===''){ delete item3.payments[mi3]; }
        else item3.payments[mi3] = parseNum(t.value);
        save(); rerenderCurrent();
      }
      return;
    }
    if(action === 'cc-spend'){
      var listCC = findList(t.dataset.list);
      var itemCC = listCC.filter(function(x){return x.id===t.dataset.id;})[0];
      var miCC = parseInt(t.dataset.mi,10);
      if(itemCC){
        itemCC.additions = itemCC.additions || {};
        if(String(t.value).trim()===''){ delete itemCC.additions[miCC]; }
        else itemCC.additions[miCC] = Math.max(0, parseNum(t.value));
        save(); rerenderCurrent();
      }
      return;
    }
    if(action === 'kk-rate'){
      var list9 = findList(t.dataset.list);
      var item9 = list9.filter(function(x){return x.id===t.dataset.id;})[0];
      var mi9 = parseInt(t.dataset.mi,10);
      if(item9 && !isNaN(mi9)){
        if(String(t.value).trim()===''){
          if(Array.isArray(item9[t.dataset.field+'Monthly'])) item9[t.dataset.field+'Monthly'][mi9] = null;
        } else {
          setDebtFieldMonthly(item9, t.dataset.field, mi9, Math.max(0, parseNum(t.value)));
        }
        save(); rerenderCurrent();
      }
      return;
    }
  }

  function onClick(e){
    var t = e.target;
    var action = t.dataset.action;
    if(!action) return;

    if(action === 'export-data'){
      var blob = new Blob([JSON.stringify(STATE, null, 2)], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'yedek.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      return;
    }

    if(action === 'toggle-paid'){
      var listP = findList(t.dataset.list);
      var itemP = listP.filter(function(x){return x.id===t.dataset.id;})[0];
      var miP = parseInt(t.dataset.mi,10);
      if(itemP){
        itemP.paidMonths = itemP.paidMonths || {};
        itemP.missedMonths = itemP.missedMonths || {};
        if(itemP.paidMonths[miP]) delete itemP.paidMonths[miP];
        else { itemP.paidMonths[miP] = true; delete itemP.missedMonths[miP]; }
        save(); rerenderCurrent();
      }
      return;
    }
    if(action === 'toggle-missed'){
      var listMs = findList(t.dataset.list);
      var itemMs = listMs.filter(function(x){return x.id===t.dataset.id;})[0];
      var miMs = parseInt(t.dataset.mi,10);
      if(itemMs){
        itemMs.missedMonths = itemMs.missedMonths || {};
        itemMs.paidMonths = itemMs.paidMonths || {};
        if(itemMs.missedMonths[miMs]) delete itemMs.missedMonths[miMs];
        else { itemMs.missedMonths[miMs] = true; delete itemMs.paidMonths[miMs]; }
        save(); rerenderCurrent();
      }
      return;
    }
    if(action === 'move-up'){ moveItem(t.dataset.list, t.dataset.id, -1); return; }
    if(action === 'move-down'){ moveItem(t.dataset.list, t.dataset.id, 1); return; }
    if(action === 'hide-item'){
      var listH = findList(t.dataset.list);
      var itemH = listH.filter(function(x){return x.id===t.dataset.id;})[0];
      if(itemH){ itemH.hidden = true; save(); rerenderCurrent(); }
      return;
    }
    if(action === 'show-item'){
      var listS = findList(t.dataset.list);
      var itemS = listS.filter(function(x){return x.id===t.dataset.id;})[0];
      if(itemS){ itemS.hidden = false; save(); rerenderCurrent(); }
      return;
    }

    if(action === 'step'){
      var mi = current - 1;
      if(mi < 0) return;
      var field = t.dataset.field;
      var d = parseInt(t.dataset.d,10);
      var mv = STATE.salaryMonthly[MONTHS[mi]];
      mv[field] = Math.max(0, (mv[field]||0) + d);
      save(); rerenderCurrent(); return;
    }
    if(action === 'add-offbudget'){
      var addOffMi = parseInt(t.dataset.mi,10);
      if(isNaN(addOffMi) || addOffMi<0 || addOffMi>11) return;
      STATE.offBudgetExpenses[addOffMi].push({id:uid(),ad:'Yeni Harcama',tutar:0,paid:false});
      save(); rerenderCurrent(); return;
    }
    if(action === 'offbudget-del'){
      var delOffMi = parseInt(t.dataset.mi,10);
      var delOffList = STATE.offBudgetExpenses[delOffMi] || [];
      var delOffIndex = delOffList.findIndex(function(x){return x.id===t.dataset.id;});
      if(delOffIndex>-1){
        var delOffItem = delOffList[delOffIndex];
        lastDeleted = {type:'offbudget', offMi:delOffMi, item:delOffItem, index:delOffIndex};
        delOffList.splice(delOffIndex,1);save();rerenderCurrent();
        showUndoToast('"'+(delOffItem.ad||'Kalem')+'" silindi.');
      }
      return;
    }
    if(action === 'offbudget-toggle-paid'){
      var potMi = parseInt(t.dataset.mi,10);
      var potList = STATE.offBudgetExpenses[potMi] || [];
      var potItem = potList.filter(function(x){return x.id===t.dataset.id;})[0];
      if(potItem){ potItem.paid = !potItem.paid; save(); rerenderCurrent(); }
      return;
    }
    if(action === 'del'){
      var list = findList(t.dataset.list);
      var i = list.findIndex(function(x){return x.id===t.dataset.id;});
      if(i>-1){
        var delItem = list[i];
        lastDeleted = {type:'list', listName:t.dataset.list, item:delItem, index:i};
        list.splice(i,1); save(); rerenderCurrent();
        showUndoToast('"'+(delItem.ad||'Kalem')+'" silindi.');
      }
      return;
    }
    if(action === 'add-simple'){
      var list2 = findList(t.dataset.list);
      if(t.dataset.list==='faturalar') list2.push({id:uid(), ad:'Yeni Fatura', tutar:0, monthlyAmounts:MONTHS.map(function(){return 0;}), cardTransfers:{}, sortOrder:STATE.faturalar.length});
      else if(t.dataset.list==='expenses') list2.push({id:uid(), ad:'Yeni Kalem', tutar:0, monthlyAmounts:MONTHS.map(function(){return 0;})});
      else list2.push({id:uid(), ad:'Yeni Kalem', tutar:0});
      save(); rerenderCurrent(); return;
    }
    if(action === 'add-ek'){
      STATE.ekBorclular.push({id:uid(), ad:'Yeni Kişi', baslangic:0, startMonthIndex:Math.max(0,current-1), payments:{}, balanceOverrides:{}, additions:{}, paidMonths:{}, missedMonths:{}, hidden:false, sortOrder:STATE.ekBorclular.length});
      save(); rerenderCurrent(); return;
    }
    if(action === 'transfer-bill'){
      var transferMi = parseInt(t.dataset.mi,10);
      var transferBill = STATE.faturalar.filter(function(x){return x.id===t.dataset.id;})[0];
      var cardSelect = document.getElementById('billCard_'+t.dataset.id+'_'+transferMi);
      var cardId = cardSelect ? cardSelect.value : '';
      var amount = transferBill ? billAmountForMonth(transferBill, transferMi) : 0;
      if(!cardId){ window.alert('Kart seçin.'); return; }
      transferBill.cardTransfers = transferBill.cardTransfers || {};
      transferBill.cardTransfers[transferMi] = {cardId:cardId, amount:amount, targetMonth:transferMi+1};
      transferBill.monthlyAmounts[transferMi] = 0;
      save(); rerenderCurrent(); return;
    }
    if(action === 'undo-bill-transfer'){
      var undoMi = parseInt(t.dataset.mi,10);
      var undoBill = STATE.faturalar.filter(function(x){return x.id===t.dataset.id;})[0];
      var undoTransfer = undoBill && undoBill.cardTransfers ? undoBill.cardTransfers[undoMi] : null;
      if(undoBill && undoTransfer){
        undoBill.monthlyAmounts[undoMi] = Number(undoTransfer.amount || 0);
        delete undoBill.cardTransfers[undoMi];
        save(); rerenderCurrent();
      }
      return;
    }
    if(action === 'transfer-offbudget'){
      var obTransferMi = parseInt(t.dataset.mi,10);
      var obTransferList = STATE.offBudgetExpenses[obTransferMi] || [];
      var obTransferItem = obTransferList.filter(function(x){return x.id===t.dataset.id;})[0];
      var obCardSelect = document.getElementById('obCard_'+t.dataset.id+'_'+obTransferMi);
      var obCardId = obCardSelect ? obCardSelect.value : '';
      if(!obCardId){ window.alert('Kart seçin.'); return; }
      if(obTransferItem){
        var obAmount = Number(obTransferItem.tutar||0);
        obTransferItem.cardTransfer = {cardId:obCardId, amount:obAmount, targetMonth:obTransferMi+1};
        obTransferItem.tutar = 0;
        save(); rerenderCurrent();
      }
      return;
    }
    if(action === 'undo-offbudget-transfer'){
      var obUndoMi = parseInt(t.dataset.mi,10);
      var obUndoList = STATE.offBudgetExpenses[obUndoMi] || [];
      var obUndoItem = obUndoList.filter(function(x){return x.id===t.dataset.id;})[0];
      if(obUndoItem && obUndoItem.cardTransfer){
        obUndoItem.tutar = Number(obUndoItem.cardTransfer.amount || 0);
        obUndoItem.cardTransfer = null;
        save(); rerenderCurrent();
      }
      return;
    }
    if(action === 'open-add-debt'){
      pendingAddDebtMonth = Math.max(0,current - 1);
      var slot = document.getElementById('addDebtSlot');
      if(slot){
        slot.innerHTML = addDebtFormHtml(pendingAddDebtMonth);
        var turSel = document.getElementById('ndTur');
        var kkRow = document.getElementById('ndKKRow');
        var kmhRow = document.getElementById('ndKMHRow');
        var krRow = document.getElementById('ndKrediRow');
        turSel.addEventListener('change', function(){
          kkRow.style.display = (turSel.value==='kredi_karti') ? 'flex' : 'none';
          kmhRow.style.display = (turSel.value==='kmh') ? 'flex' : 'none';
          krRow.style.display = (turSel.value==='kredi') ? 'flex' : 'none';
        });
        document.getElementById('ndCancel').addEventListener('click', function(){ slot.innerHTML=''; });
        document.getElementById('ndSave').addEventListener('click', function(){
          var ad = document.getElementById('ndAd').value.trim() || 'Yeni Borç';
          var tur = turSel.value;
          var baslangic = parseNum(document.getElementById('ndBaslangic').value);
          var startMonth = parseInt(document.getElementById('ndStartMonth').value,10);
          var nd = {id:uid(), ad:ad, tur:tur, baslangic:baslangic, startMonthIndex:isNaN(startMonth)?0:startMonth, payments:{}, balanceOverrides:{}, additions:{}, paidMonths:{}, missedMonths:{}, hidden:false, sortOrder:STATE.debts.length};
          if(tur==='kredi_karti'){
            nd.asgariYuzde = parseNum(document.getElementById('ndAsgari').value) || 20;
            nd.faizYuzde = parseNum(document.getElementById('ndFaiz').value) || 5;
          } else if(tur==='kmh'){
            nd.faizYuzde = parseNum(document.getElementById('ndKmhFaiz').value) || 5;
          } else if(tur==='kredi'){
            nd.taksit = parseNum(document.getElementById('ndTaksit').value) || baslangic;
          }
          STATE.debts.push(nd);
          save(); rerenderCurrent();
        });
      }
      return;
    }
  }

  document.getElementById('book').addEventListener('change', onChange);
  document.getElementById('book').addEventListener('click', onClick);

  buildTabs();
  loadFromSupabase().then(function(){
    baseLeaf.innerHTML = renderPage(0);
    updateIndicator();
  });

  // Cihazlar arası tam veri akışı: sekme/uygulama tekrar görünür olduğunda,
  // pencere odağı geri geldiğinde ve düzenli aralıklarla buluttan kontrol et.
  if(syncDotEl) syncDotEl.addEventListener('click', function(){
    if(syncDotEl.classList.contains('error')){
      window.alert('⚠ Buluta ulaşılamıyor\n\nHata: '+lastSyncErrorDetail+'\n\nVerilerin bu cihazda güvende (yerelde kayıtlı), sadece diğer cihazlarla henüz senkron değil. Şimdi tekrar deniyorum…');
    }
    refreshFromCloud(true);
  });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) refreshFromCloud(false); });
  window.addEventListener('focus', function(){ refreshFromCloud(false); });
  window.addEventListener('pageshow', function(){ refreshFromCloud(false); });
  setInterval(function(){ if(!document.hidden) refreshFromCloud(false); }, 25000);
})();
</script>

<script>
(function(){
  var installBtn = document.getElementById('installBtn');
  var deferredInstallPrompt = null;
  var bookEl = document.getElementById('book');
  var zoomOutBtn = document.getElementById('zoomOut');
  var zoomInBtn = document.getElementById('zoomIn');
  var ZOOM_KEY = 'birikimDefteri_zoom';
  var zoomLevel = parseFloat(localStorage.getItem(ZOOM_KEY)) || 1;
  
  function applyZoom(){ if(bookEl) bookEl.style.zoom = zoomLevel; }
  applyZoom();

  if(zoomInBtn) zoomInBtn.addEventListener('click', function(){
    zoomLevel = Math.min(1.6, Math.round((zoomLevel + 0.1) * 100) / 100);
    localStorage.setItem(ZOOM_KEY, zoomLevel); applyZoom();
  });
  if(zoomOutBtn) zoomOutBtn.addEventListener('click', function(){
    zoomLevel = Math.max(0.8, Math.round((zoomLevel - 0.1) * 100) / 100);
    localStorage.setItem(ZOOM_KEY, zoomLevel); applyZoom();
  });

  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault(); deferredInstallPrompt = e;
    if(installBtn) installBtn.hidden = false;
  });

  if(installBtn){
    installBtn.addEventListener('click',function(){
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.then(function(){
        deferredInstallPrompt = null; installBtn.hidden = true;
      });
    });
  }
})();
</script>
